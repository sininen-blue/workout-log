{% extends 'base.html' %}
{% block title %}Add Set{% endblock %}
{% block content %}
    <h1 class="font-semibold text-lg mb-2">Add Set</h1>
    <form class="flex flex-col gap-2"
          action="{% url 'set:store' %}"
          method="post">
        {% csrf_token %}
        <input type="hidden" id="id" name="id" value="{{ exercise.id }}">
        <div x-data="{ increment: 5}" class="flex flex-col gap-1">
            <label for="weight">Weight:</label>
            <div x-data="{ weight:
                {% if latestSet %}
                    {{ latestSet.weight }}
                {% else %}
                    0
                {% endif %}
                }" class="flex flex-row justify-between gap-2">
                <input x-model="weight"
                       class="bg-stone-200 h-20 text-4xl p-2"
                       type="number"
                       id="weight"
                       name="weight"
                       required>
                <div class="flex flex-row gap-2">
                    <button x-on:click="weight+=increment"
                            type="button"
                            class="bg-stone-200 w-20 h-20">Up</button>
                    <button x-on:click="weight-=increment"
                            type="button"
                            class="bg-stone-200 w-20 h-20">Down</button>
                </div>
            </div>
            <div class="flex flex-row gap-2">
                <button x-on:click="increment = 1"
                        x-bind:class="increment == 1 ? 'border-blue-500' : ''"
                        type="button"
                        class="border bg-stone-200 w-20 h-20">1</button>
                <button x-on:click="increment = 5"
                        x-bind:class="increment == 5 ? 'border-blue-500' : ''"
                        type="button"
                        class="border bg-stone-200 w-20 h-20">5</button>
                <button x-on:click="increment = 10"
                        x-bind:class="increment == 10 ? 'border-blue-500' : ''"
                        type="button"
                        class="border bg-stone-200 w-20 h-20">10</button>
            </div>
        </div>
        <div class="flex flex-col gap-1">
            <label for="reps">Reps:</label>
            <div x-data="{ reps:
                {% if latestSet %}
                    {{ latestSet.reps }}
                {% else %}
                    0
                {% endif %}
                }" class="flex flex-row justify-between gap-2">
                <input x-model="reps"
                       class="bg-stone-200 h-20 text-4xl p-2"
                       type="number"
                       id="reps"
                       name="reps"
                       required>
                <div class="flex flex-row gap-2">
                    <button x-on:click="reps++" type="button" class="bg-stone-200 w-20 h-20">Up</button>
                    <button x-on:click="reps--" type="button" class="bg-stone-200 w-20 h-20">Down</button>
                </div>
            </div>
        </div>
        {% include "../components/input_button.html" %}
    </form>
{% endblock %}
